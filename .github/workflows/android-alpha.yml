name: Verificar y publicar alpha (Android, Windows y Linux)

on:
  push:
    branches: [main]
    paths:
      - project.godot
      - export_presets.cfg
      - .github/workflows/android-alpha.yml
      - scripts/**
      - scenes/**
      - docs/releases/**
      - assets/branding/**
      - instalador/**
      - tests/balance_test.gd
      - tests/visual_asset_test.gd
      - herramientas/comprobar_archivos.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android preinstalado en Ubuntu
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: SDK para Godot 4.3
        shell: bash
        run: |
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null || true
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"
          test -f "$ANDROID_HOME/platform-tools/adb"

      - name: Motor Godot oficial 4.3
        shell: bash
        run: |
          curl -fL --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Plantillas oficiales Android y Windows 4.3
        shell: bash
        run: |
          curl -fL --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" \
            'templates/android_debug.apk' 'templates/android_release.apk' \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' \
            'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' \
            -d "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/windows_release_x86_64.exe"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/linux_release.x86_64"

      - name: Configurar SDK y firma del APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Con una llave fija (secretos del repositorio) cada APK nuevo se
          # instala encima del anterior y conserva la partida. Sin secretos se
          # crea una llave temporal, como antes: sirve para probar, pero Android
          # no deja actualizar encima de un APK firmado con otra llave.
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            ALIAS="${KEYSTORE_ALIAS:-templo}"
            PASS="$KEYSTORE_PASS"
            keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass "$PASS" -alias "$ALIAS" >/dev/null
            echo "Firma: llave fija del repositorio (alias $ALIAS)."
          else
            ALIAS="androiddebugkey"
            PASS="android"
            keytool -genkeypair -storetype PKCS12 \
              -keystore "$RUNNER_TEMP/debug.keystore" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 365 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Android Debug,O=El Templo de los Ecos,C=DO"
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: llave temporal, el APK no se podra instalar encima del anterior."
          fi
          echo "::add-mask::$PASS"
          echo "APK_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "APK_KEY_PASS=$PASS" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          for version in 4 4.3; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
              echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
              echo "export/android/debug_keystore_user = \"$ALIAS\""
              echo "export/android/debug_keystore_pass = \"$PASS\""
            } > "$HOME/.config/godot/editor_settings-$version.tres"
          done

      - name: Comprobar que la version del juego coincide en todos lados
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)"
          JUEGO="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          echo "export_presets: $VERSION · project.godot: $JUEGO"
          test -n "$VERSION"
          test "$VERSION" = "$JUEGO"
          grep -Fq 'permissions/internet=true' export_presets.cfg

      - name: Validacion del proyecto y modo Vigilia
        shell: bash
        run: |
          godot --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/import.log"; then
            echo 'Error al importar recursos'
            exit 1
          fi
          godot --headless --path . --script res://tests/defense_test.gd 2>&1 | tee "$RUNNER_TEMP/defense.log"
          grep -Fq 'OK: defensa tactil, ingreso, mejoras, centinelas, reparacion, victoria y derrota.' "$RUNNER_TEMP/defense.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/defense.log"; then exit 1; fi
          godot --headless --path . --script res://tests/update_test.gd 2>&1 | tee "$RUNNER_TEMP/update.log"
          grep -Fq 'OK: actualizador con versiones, archivo por plataforma, reemplazo del juego y aviso en el menú.' "$RUNNER_TEMP/update.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/update.log"; then exit 1; fi

      - name: Simular partida completa antes de compilar
        shell: bash
        run: |
          godot --headless --path . --script res://tests/balance_test.gd 2>&1 | tee "$RUNNER_TEMP/balance.log"
          grep -Fq 'OK: partida completa, economia equilibrada, record, reinicio y derrota sin defensas.' "$RUNNER_TEMP/balance.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/balance.log"; then exit 1; fi

      - name: Validar sprites, sonidos y controles moviles
        shell: bash
        run: |
          godot --headless --path . --script res://tests/visual_asset_test.gd 2>&1 | tee "$RUNNER_TEMP/visual.log"
          grep -Fq 'OK: recursos visuales nuevos, originales y enemigos cargados correctamente.' "$RUNNER_TEMP/visual.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/visual.log"; then exit 1; fi
          godot --headless --path . --script res://tests/mobile_input_test.gd 2>&1 | tee "$RUNNER_TEMP/mobile.log"
          grep -Fq 'OK: toques de inicio, joystick, linterna, refugio y descanso.' "$RUNNER_TEMP/mobile.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/mobile.log"; then exit 1; fi

      - name: Generar APK Android ARM64
        shell: bash
        run: |
          mkdir -p build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="$APK_KEY_ALIAS" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$APK_KEY_PASS" \
          godot --headless --verbose --path . --export-debug "Android" \
            build/ElTemploDeLosEcos-Android-Debug.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          APK="build/ElTemploDeLosEcos-Android-Debug.apk"
          test -s "$APK"
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/export.log"; then
            echo "Godot registro errores en la exportacion. No publicar el APK."
            exit 1
          fi
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/android-badging.txt"
          grep -Fq "package: name='org.je7remy.temploecos'" "$RUNNER_TEMP/android-badging.txt"
          grep -Fq "versionName='0.5.9-alpha'" "$RUNNER_TEMP/android-badging.txt"
          ls -lh "$APK"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: ElTemploDeLosEcos-Android-Debug
          path: build/ElTemploDeLosEcos-Android-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generar juego de Windows (x86_64)
        shell: bash
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" \
            build/windows/ElTemploDeLosEcos.exe 2>&1 | tee "$RUNNER_TEMP/export-windows.log"
          test -s build/windows/ElTemploDeLosEcos.exe
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/export-windows.log"; then
            echo "Godot registro errores en la exportacion de Windows."
            exit 1
          fi
          file build/windows/ElTemploDeLosEcos.exe | grep -Fq 'PE32+ executable'
          ls -lh build/windows/ElTemploDeLosEcos.exe

      - name: Instalador y version portable de Windows
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis zip
          VERSION="$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)"
          SETUP="$PWD/build/ElTemploDeLosEcos-v$VERSION-Windows-Setup.exe"
          makensis -V2 -DVERSION="$VERSION" -DEXE="$PWD/build/windows/ElTemploDeLosEcos.exe" \
            -DSALIDA="$SETUP" instalador/windows/instalador.nsi
          test -s "$SETUP"
          cp instalador/windows/LEEME.txt build/windows/LEEME.txt
          (cd build/windows && zip -q -9 "../ElTemploDeLosEcos-v$VERSION-Windows-Portable.zip" ElTemploDeLosEcos.exe LEEME.txt)
          ls -lh build/*.exe build/*.zip

      - name: Generar juego de Linux (x86_64)
        shell: bash
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" \
            build/linux/ElTemploDeLosEcos.x86_64 2>&1 | tee "$RUNNER_TEMP/export-linux.log"
          test -s build/linux/ElTemploDeLosEcos.x86_64
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/export-linux.log"; then
            echo "Godot registro errores en la exportacion de Linux."
            exit 1
          fi
          file build/linux/ElTemploDeLosEcos.x86_64 | grep -Fq 'ELF 64-bit'
          VERSION="$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)"
          NAME="ElTemploDeLosEcos-v$VERSION-Linux-x86_64"
          mkdir -p "build/$NAME"
          cp build/linux/ElTemploDeLosEcos.x86_64 instalador/linux/instalar.sh instalador/linux/desinstalar.sh \
            instalador/linux/LEEME.txt instalador/linux/icono.png "build/$NAME/"
          chmod +x "build/$NAME/ElTemploDeLosEcos.x86_64" "build/$NAME/instalar.sh" "build/$NAME/desinstalar.sh"
          tar -C build -czf "build/$NAME.tar.gz" "$NAME"
          ls -lh "build/$NAME.tar.gz"

      - name: Guardar Windows y Linux como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: ElTemploDeLosEcos-Escritorio
          path: |
            build/ElTemploDeLosEcos-*-Windows-Setup.exe
            build/ElTemploDeLosEcos-*-Windows-Portable.zip
            build/ElTemploDeLosEcos-*-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publicar la version (Android, Windows y Linux) y marcarla como la ultima
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version\/name="\(.*\)"$/\1/p' export_presets.cfg)"
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"
          # Ademas de los archivos con la version en el nombre, se suben copias
          # con nombre fijo para que estos enlaces bajen siempre la ultima:
          #   https://github.com/<repo>/releases/latest/download/ElTemploDeLosEcos-Windows-Setup.exe
          publicar_fijos() {
            local origen="$1"
            rm -rf build/fijos
            mkdir -p build/fijos
            cp "$origen/ElTemploDeLosEcos-$TAG-Android.apk" build/fijos/ElTemploDeLosEcos-Android.apk
            cp "$origen/ElTemploDeLosEcos-$TAG-Windows-Setup.exe" build/fijos/ElTemploDeLosEcos-Windows-Setup.exe
            cp "$origen/ElTemploDeLosEcos-$TAG-Windows-Portable.zip" build/fijos/ElTemploDeLosEcos-Windows-Portable.zip
            cp "$origen/ElTemploDeLosEcos-$TAG-Linux-x86_64.tar.gz" build/fijos/ElTemploDeLosEcos-Linux-x86_64.tar.gz
            gh release upload "$TAG" build/fijos/* --clobber
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            # La version ya existe: sus archivos no se recompilan (seguirian
            # siendo los mismos que se probaron). Solo se asegura que figure
            # como la ultima version y que tenga las copias de nombre fijo,
            # hechas con sus propios archivos.
            echo "El release $TAG ya existe: se marca como la ultima version."
            gh release edit "$TAG" --prerelease=false --latest
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'ElTemploDeLosEcos-Windows-Setup.exe'; then
              rm -rf build/existente
              gh release download "$TAG" -D build/existente -p "ElTemploDeLosEcos-$TAG-*"
              publicar_fijos build/existente
            fi
            exit 0
          fi
          test -s "$NOTES"
          APK="build/ElTemploDeLosEcos-$TAG-Android.apk"
          cp build/ElTemploDeLosEcos-Android-Debug.apk "$APK"
          SETUP="build/ElTemploDeLosEcos-$TAG-Windows-Setup.exe"
          PORTABLE="build/ElTemploDeLosEcos-$TAG-Windows-Portable.zip"
          LINUX="build/ElTemploDeLosEcos-$TAG-Linux-x86_64.tar.gz"
          test -s "$SETUP"
          test -s "$PORTABLE"
          test -s "$LINUX"
          gh release create "$TAG" "$APK" "$SETUP" "$PORTABLE" "$LINUX" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "El Templo de los Ecos $TAG" \
            --notes-file "$NOTES"
          publicar_fijos build
          echo "Publicado $TAG con $APK, $SETUP, $PORTABLE y $LINUX (y sus copias de nombre fijo)"
