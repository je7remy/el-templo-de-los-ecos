name: Compilar APK Android v0.4.1-alpha

on:
  push:
    branches: [main]
    paths:
      - project.godot
      - export_presets.cfg
      - .github/workflows/android-alpha.yml
      - scripts/main.gd
      - scripts/defense.gd
      - scenes/defense.tscn
      - docs/releases/v0.4.1-alpha.md
      - assets/branding/**
      - tests/balance_test.gd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK Android preinstalado en Ubuntu
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: SDK para Godot 4.3
        shell: bash
        run: |
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null || true
          "$SDKMANAGER_PATH" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"
          test -f "$ANDROID_HOME/platform-tools/adb"

      - name: Motor Godot oficial 4.3
        shell: bash
        run: |
          curl -fL --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Plantillas oficiales Android 4.3
        shell: bash
        run: |
          curl -fL --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" \
            'templates/android_debug.apk' 'templates/android_release.apk' \
            -d "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Configurar SDK y firma de depuracion temporal
        shell: bash
        run: |
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 365 -storepass android -keypass android \
            -dname "CN=Android Debug,O=El Templo de los Ecos,C=DO"
          mkdir -p "$HOME/.config/godot"
          for version in 4 4.3; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
              echo "export/android/debug_keystore = \"$RUNNER_TEMP/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/editor_settings-$version.tres"
          done

      - name: Validacion del proyecto y modo Vigilia
        shell: bash
        run: |
          godot --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/import.log"; then
            echo 'Error al importar recursos'
            exit 1
          fi
          godot --headless --path . --script res://tests/defense_test.gd 2>&1 | tee "$RUNNER_TEMP/defense.log"
          grep -Fq 'OK: defensa tactil, ingreso, mejoras, centinelas, reparacion, victoria y derrota.' "$RUNNER_TEMP/defense.log"

      - name: Simular partida completa antes de compilar
        shell: bash
        run: |
          godot --headless --path . --script res://tests/balance_test.gd 2>&1 | tee "$RUNNER_TEMP/balance.log"
          grep -Fq 'OK: partida completa, economia equilibrada, record, reinicio y derrota sin defensas.' "$RUNNER_TEMP/balance.log"

      - name: Generar APK Android ARM64
        shell: bash
        run: |
          mkdir -p build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore" \
          GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" \
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android" \
          godot --headless --verbose --path . --export-debug "Android" \
            build/ElTemploDeLosEcos-Android-Debug.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          APK="build/ElTemploDeLosEcos-Android-Debug.apk"
          test -s "$APK"
          if grep -E 'ERROR:|SCRIPT ERROR|Parse Error' "$RUNNER_TEMP/export.log"; then
            echo "Godot registro errores en la exportacion. No publicar el APK."
            exit 1
          fi
          unzip -tq "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/android-badging.txt"
          grep -Fq "package: name='org.je7remy.temploecos'" "$RUNNER_TEMP/android-badging.txt"
          grep -Fq "versionName='0.4.1-alpha'" "$RUNNER_TEMP/android-badging.txt"
          ls -lh "$APK"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v6
        with:
          name: ElTemploDeLosEcos-Android-Debug
          path: build/ElTemploDeLosEcos-Android-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Crear prerelease con APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.4.1-alpha"
          APK="build/ElTemploDeLosEcos-Android-Debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "El Templo de los Ecos — v0.4.1 Alpha (Android)" \
              --notes-file docs/releases/v0.4.1-alpha.md \
              --prerelease
          fi
