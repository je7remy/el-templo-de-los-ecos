name: Validar Godot 4.3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v6

      - name: Instalar Godot 4.3 oficial
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/godot" --version

      - name: Verificar archivos esenciales
        run: python3 herramientas/comprobar_archivos.py

      - name: Importar recursos y analizar scripts de Godot
        shell: bash
        run: |
          godot --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/import.log"; then
            echo "Se detectaron errores al importar el proyecto"
            exit 1
          fi

      - name: Ejecutar prueba de escenas y muerte
        shell: bash
        run: |
          godot --headless --verbose --path . --script res://tests/smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if ! grep -Fq 'OK: carga, inicio, 5 salas, sello y desenlace de muerte.' "$RUNNER_TEMP/smoke.log"; then
            echo "La prueba de humo no alcanzo su resultado esperado"
            exit 1
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/smoke.log"; then
            echo "Error de campaña o recurso retenido en Godot."
            exit 1
          fi

      - name: Verificar modo Vigilia del Claustro
        shell: bash
        run: |
          godot --headless --path . --script res://tests/defense_test.gd 2>&1 | tee "$RUNNER_TEMP/defense.log"
          grep -Fq 'OK: defensa tactil, ingreso, mejoras, centinelas, reparacion, victoria y derrota.' "$RUNNER_TEMP/defense.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/defense.log"; then
            echo "Fallo la prueba del nuevo modo de defensa"
            exit 1
          fi


      - name: Verificar texturas de escenarios, enemigo y protagonista
        shell: bash
        run: |
          godot --headless --path . --script res://tests/visual_asset_test.gd 2>&1 | tee "$RUNNER_TEMP/visual.log"
          grep -Fq 'OK: recursos visuales nuevos, originales y enemigos cargados correctamente.' "$RUNNER_TEMP/visual.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/visual.log"; then exit 1; fi

      - name: Comprobar identidad visual del juego
        shell: bash
        run: |
          godot --headless --path . --script res://tests/brand_test.gd 2>&1 | tee "$RUNNER_TEMP/brand.log"
          grep -Fq 'OK: icono y logotipo originales disponibles como texturas.' "$RUNNER_TEMP/brand.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/brand.log"; then exit 1; fi

      - name: Simular partida completa y balance de Vigilia
        shell: bash
        run: |
          godot --headless --path . --script res://tests/balance_test.gd 2>&1 | tee "$RUNNER_TEMP/balance.log"
          grep -Fq 'OK: partida completa, economia equilibrada, record, reinicio y derrota sin defensas.' "$RUNNER_TEMP/balance.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/balance.log"; then exit 1; fi

      - name: Probar los botones tactiles
        shell: bash
        run: |
          godot --headless --path . --script res://tests/mobile_input_test.gd 2>&1 | tee "$RUNNER_TEMP/mobile.log"
          grep -Fq 'OK: toques de inicio, joystick, linterna, refugio y descanso.' "$RUNNER_TEMP/mobile.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|ObjectDB instances leaked' "$RUNNER_TEMP/mobile.log"; then
            echo "Fallo un control tactil del proyecto"
            exit 1
          fi
